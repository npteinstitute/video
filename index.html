<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NPTE Institute · Instagram Card Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0A1F44;
      --navy-2: #0F172A;
      --teal: #0D9488;
      --teal-light: #14B8A6;
      --gold: #D4A017;
      --white: #FFFFFF;
      --gray: #94A3B8;
      --card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.12);
      --success: #10B981;
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: radial-gradient(ellipse at 20% 0%, #122a55 0%, var(--navy-2) 50%, #070d1a 100%);
      color: var(--white);
      -webkit-font-smoothing: antialiased;
    }
    .app { max-width: 1280px; margin: 0 auto; padding: 28px 20px 60px; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 28px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--teal), var(--teal-light));
      display: grid; place-items: center; font-weight: 800; font-size: 14px;
      box-shadow: 0 8px 24px rgba(13,148,136,0.35);
    }
    .brand h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em;
    }
    .brand p { color: var(--gray); font-size: 0.82rem; margin-top: 2px; }
    .badge {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 8px 14px; border-radius: 999px;
      background: rgba(13,148,136,0.15); color: var(--teal-light);
      border: 1px solid rgba(13,148,136,0.3);
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(320px, 400px) 1fr;
      gap: 28px;
      align-items: start;
    }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      backdrop-filter: blur(12px);
    }
    .panel h2 {
      font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--gray); margin-bottom: 16px;
    }
    label {
      display: block; font-size: 0.78rem; font-weight: 600;
      color: var(--gray); margin-bottom: 6px; margin-top: 14px;
    }
    label:first-of-type { margin-top: 0; }
    input, textarea {
      width: 100%;
      background: rgba(0,0,0,0.28);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--white);
      font-family: inherit;
      font-size: 0.92rem;
      padding: 11px 13px;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--teal); }
    textarea { min-height: 80px; resize: vertical; line-height: 1.45; }
    .opts { display: grid; gap: 8px; }
    .opt-row {
      display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: center;
    }
    .opt-letter {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(13,148,136,0.2); color: var(--teal-light);
      display: grid; place-items: center; font-weight: 700; font-size: 0.85rem;
    }
    .correct-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .correct-row label.radio {
      margin: 0; display: flex; align-items: center; gap: 6px;
      padding: 8px 12px; border-radius: 10px;
      background: rgba(0,0,0,0.22); border: 1px solid var(--border);
      cursor: pointer; font-size: 0.85rem; color: var(--white); font-weight: 500;
    }
    .correct-row input { width: auto; accent-color: var(--teal); }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    button {
      font-family: inherit; font-weight: 600; font-size: 0.9rem;
      border: none; border-radius: 12px; padding: 12px 18px; cursor: pointer;
    }
    button:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, var(--teal), var(--teal-light));
      color: white; box-shadow: 0 10px 28px rgba(13,148,136,0.35);
      flex: 1; min-width: 140px;
    }
    .btn-ghost {
      background: rgba(255,255,255,0.06);
      color: var(--white); border: 1px solid var(--border);
    }
    .btn-download {
      background: rgba(212,160,23,0.15);
      color: var(--gold); border: 1px solid rgba(212,160,23,0.35);
      width: 100%; margin-top: 8px;
    }
    .previews {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 1100px) {
      .previews { grid-template-columns: 1fr; max-width: 300px; margin: 0 auto; }
    }
    .card-preview {
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }
    .card-preview h3 {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase; color: var(--gray); margin-bottom: 10px;
    }
    .frame {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      background: #0a1628;
      box-shadow: 0 16px 36px rgba(0,0,0,0.4);
    }
    .frame canvas { width: 100%; height: 100%; display: block; }
    .hint { margin-top: 16px; font-size: 0.8rem; color: var(--gray); line-height: 1.5; }
    .status { margin-top: 12px; font-size: 0.82rem; color: var(--teal-light); min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-mark">NI</div>
        <div>
          <h1>NPTE Institute</h1>
          <p>Instagram Card Studio · 3 squares · 1080×1080</p>
        </div>
      </div>
      <div class="badge">IG Feed · 1:1 Square</div>
    </header>

    <div class="grid">
      <aside class="panel">
        <h2>Content</h2>
        <label for="question">Question</label>
        <textarea id="question">On assessment, a patient tests positive for the Dix-Hallpike test on the right side for posterior canalithiasis. Which finding is MOST LIKELY?</textarea>

        <label>Answer choices</label>
        <div class="opts">
          <div class="opt-row"><div class="opt-letter">A</div><input id="optA" value="Downbeating torsional nystagmus for 120 seconds" /></div>
          <div class="opt-row"><div class="opt-letter">B</div><input id="optB" value="Upbeating torsional nystagmus for 70 seconds" /></div>
          <div class="opt-row"><div class="opt-letter">C</div><input id="optC" value="Downbeating torsional nystagmus for 10 seconds" /></div>
          <div class="opt-row"><div class="opt-letter">D</div><input id="optD" value="Upbeating torsional nystagmus for 40 seconds" /></div>
        </div>

        <label>Correct answer</label>
        <div class="correct-row">
          <label class="radio"><input type="radio" name="correct" value="A" /> A</label>
          <label class="radio"><input type="radio" name="correct" value="B" /> B</label>
          <label class="radio"><input type="radio" name="correct" value="C" /> C</label>
          <label class="radio"><input type="radio" name="correct" value="D" checked /> D</label>
        </div>

        <label for="rationale">Rationale</label>
        <textarea id="rationale">Right Dix-Hallpike with upbeating torsional nystagmus lasting under 60 seconds indicates right posterior canal canalithiasis — the most common BPPV variant.</textarea>

        <label for="ctaLine">Follow line (card 3)</label>
        <input id="ctaLine" value="Follow for more NPTE questions & tips" />

        <label for="shareLine">Share line (card 3)</label>
        <input id="shareLine" value="Share with a classmate and test their knowledge" />

        <div class="btn-row">
          <button class="btn-primary" id="btnRender" type="button">Update previews</button>
          <button class="btn-ghost" id="btnReset" type="button">Reset sample</button>
        </div>
        <button class="btn-download" id="btnDownloadAll" type="button">Download all 3 PNGs</button>
        <div class="status" id="status"></div>
        <p class="hint"><strong>1080×1080 square</strong> — classic Instagram feed & carousel size. Works on Facebook too.</p>
      </aside>

      <section class="panel">
        <h2>Preview · 1:1 Square</h2>
        <div class="previews">
          <div class="card-preview">
            <h3>1 · Question</h3>
            <div class="frame"><canvas id="c1" width="1080" height="1080"></canvas></div>
            <button class="btn-download" data-card="1" type="button">Download PNG</button>
          </div>
          <div class="card-preview">
            <h3>2 · Rationale</h3>
            <div class="frame"><canvas id="c2" width="1080" height="1080"></canvas></div>
            <button class="btn-download" data-card="2" type="button">Download PNG</button>
          </div>
          <div class="card-preview">
            <h3>3 · Follow CTA</h3>
            <div class="frame"><canvas id="c3" width="1080" height="1080"></canvas></div>
            <button class="btn-download" data-card="3" type="button">Download PNG</button>
          </div>
        </div>
      </section>
    </div>
  </div>

    const c1 = document.getElementById('c1');
    const c2 = document.getElementById('c2');
    const c3 = document.getElementById('c3');
    const ctx1 = c1.getContext('2d');
    const ctx2 = c2.getContext('2d');
    const ctx3 = c3.getContext('2d');

    function collect() {
      const correct = (document.querySelector('input[name="correct"]:checked') || {}).value || 'D';
      return {
        question: document.getElementById('question').value.trim() || 'Your question here',
        options: {
          A: document.getElementById('optA').value.trim() || 'Option A',
          B: document.getElementById('optB').value.trim() || 'Option B',
          C: document.getElementById('optC').value.trim() || 'Option C',
          D: document.getElementById('optD').value.trim() || 'Option D',
        },
        correct,
        rationale: document.getElementById('rationale').value.trim() || 'Rationale here',
        ctaLine: document.getElementById('ctaLine').value.trim() || 'Follow for more NPTE questions & tips',
        shareLine: document.getElementById('shareLine').value.trim() || 'Share with a classmate and test their knowledge',
      };
    }

    function fillBg(ctx) {
      const g = ctx.createLinearGradient(0, 0, 0, HEIGHT);
      g.addColorStop(0, COLORS.navy);
      g.addColorStop(0.5, COLORS.dark);
      g.addColorStop(1, COLORS.navy);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
    }

    function roundRect(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function drawLogo(ctx, cx, cy, radius) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, radius + 10, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(212,160,23,0.2)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy, radius + 4, 0, Math.PI * 2);
      ctx.strokeStyle = COLORS.gold;
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.clip();
      if (logoReady) {
        ctx.drawImage(logoImage, cx - radius, cy - radius, radius * 2, radius * 2);
      } else {
        ctx.fillStyle = COLORS.navy;
        ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
        ctx.fillStyle = '#fff';
        ctx.font = '700 32px Inter, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('NI', cx, cy + 2);
      }
      ctx.restore();
    }

    function wrapLines(ctx, text, maxWidth, maxLines) {
      const words = String(text).split(/\s+/);
      const lines = [];
      let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= maxWidth) cur = test;
        else {
          if (cur) lines.push(cur);
          cur = w;
          if (maxLines && lines.length >= maxLines - 1) break;
        }
      }
      if (cur) {
        if (maxLines && lines.length >= maxLines) {
          let last = cur;
          while (ctx.measureText(last + '…').width > maxWidth && last.length > 1) last = last.slice(0, -1);
          lines[lines.length - 1] = last + '…';
        } else lines.push(cur);
      }
      return lines;
    }

    function fitFont(ctx, text, maxW, maxH, startSize, weight, lhRatio) {
      let size = startSize;
      while (size >= 14) {
        ctx.font = weight + ' ' + size + 'px Inter, system-ui, sans-serif';
        const lh = Math.round(size * lhRatio);
        const lines = wrapLines(ctx, text, maxW);
        if (lines.length * lh <= maxH && Math.max(0, ...lines.map(l => ctx.measureText(l).width)) <= maxW) {
          return { size, lh, lines };
        }
        size -= 1;
      }
      ctx.font = weight + ' 14px Inter, system-ui, sans-serif';
      return { size: 14, lh: 18, lines: wrapLines(ctx, text, maxW, Math.max(1, Math.floor(maxH / 18))) };
    }

    // ===== CARD 1: Question =====
    function drawQuestion(ctx, data) {
      fillBg(ctx);
      drawLogo(ctx, WIDTH / 2, 78, 48);

      ctx.fillStyle = COLORS.gold;
      ctx.font = '600 22px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('NPTE Practice Question', WIDTH / 2, 155);
      ctx.strokeStyle = COLORS.gold;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(WIDTH / 2 - 100, 170);
      ctx.lineTo(WIDTH / 2 + 100, 170);
      ctx.stroke();

      const qFit = fitFont(ctx, data.question, WIDTH - 90, 200, 28, '600', 1.22);
      const qPad = 22;
      const qH = Math.min(220, Math.max(90, qFit.lines.length * qFit.lh + qPad * 2));
      const qY = 190;

      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      roundRect(ctx, 28, qY, WIDTH - 56, qH, 14);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      ctx.lineWidth = 1.5;
      roundRect(ctx, 28, qY, WIDTH - 56, qH, 14);
      ctx.stroke();

      ctx.fillStyle = COLORS.white;
      ctx.font = '600 ' + qFit.size + 'px Inter, system-ui, sans-serif';
      ctx.textAlign = 'left';
      let ty = qY + qPad + qFit.lh * 0.7;
      for (const line of qFit.lines) { ctx.fillText(line, 48, ty); ty += qFit.lh; }

      let optY = qY + qH + 14;
      const letters = ['A', 'B', 'C', 'D'];
      const bottom = HEIGHT - 40;
      const fits = {};
      let total = 0;
      letters.forEach(L => {
        const f = fitFont(ctx, data.options[L], WIDTH - 170, 70, 22, '500', 1.18);
        fits[L] = f;
        total += Math.max(64, f.lines.length * f.lh + 24) + 8;
      });
      const space = bottom - optY;
      if (total > space && space > 120) {
        const scale = space / total;
        letters.forEach(L => {
          fits[L].size = Math.max(13, Math.floor(fits[L].size * scale));
          fits[L].lh = Math.round(fits[L].size * 1.18);
          ctx.font = '500 ' + fits[L].size + 'px Inter, system-ui, sans-serif';
          fits[L].lines = wrapLines(ctx, data.options[L], WIDTH - 170);
        });
      }

      letters.forEach(L => {
        const f = fits[L];
        const h = Math.max(64, f.lines.length * f.lh + 24);
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        roundRect(ctx, 28, optY, WIDTH - 56, h, 12);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 1.5;
        roundRect(ctx, 28, optY, WIDTH - 56, h, 12);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(78, optY + h / 2, 18, 0, Math.PI * 2);
        ctx.fillStyle = COLORS.teal;
        ctx.fill();
        ctx.fillStyle = COLORS.white;
        ctx.font = '700 15px Inter, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(L, 78, optY + h / 2 + 1);

        ctx.fillStyle = COLORS.white;
        ctx.font = '500 ' + f.size + 'px Inter, system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        let oy = optY + h / 2 - (f.lines.length * f.lh) / 2 + f.lh * 0.7;
        for (const line of f.lines) { ctx.fillText(line, 110, oy); oy += f.lh; }
        optY += h + 8;
      });

      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = '500 14px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('NPTE Institute', WIDTH / 2, HEIGHT - 22);
    }

    // ===== CARD 2: Rationale =====
    function drawRationale(ctx, data) {
      fillBg(ctx);
      drawLogo(ctx, WIDTH / 2, 72, 46);

      ctx.fillStyle = COLORS.white;
      ctx.font = '700 26px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('NPTE Institute', WIDTH / 2, 148);

      ctx.fillStyle = 'rgba(16,185,129,0.14)';
      roundRect(ctx, 50, 172, WIDTH - 100, 58, 12);
      ctx.fill();
      ctx.strokeStyle = COLORS.success;
      ctx.lineWidth = 2.5;
      roundRect(ctx, 50, 172, WIDTH - 100, 58, 12);
      ctx.stroke();

      ctx.fillStyle = COLORS.success;
      ctx.font = '700 22px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✓  CORRECT ANSWER:  ' + data.correct, WIDTH / 2, 201);

      const correctText = data.options[data.correct] || '';
      const cFit = fitFont(ctx, correctText, WIDTH - 180, 70, 22, '600', 1.2);
      const cH = Math.max(80, cFit.lines.length * cFit.lh + 32);
      const cY = 250;

      ctx.fillStyle = 'rgba(16,185,129,0.10)';
      roundRect(ctx, 28, cY, WIDTH - 56, cH, 12);
      ctx.fill();
      ctx.strokeStyle = COLORS.success;
      ctx.lineWidth = 2;
      roundRect(ctx, 28, cY, WIDTH - 56, cH, 12);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(88, cY + cH / 2, 22, 0, Math.PI * 2);
      ctx.fillStyle = COLORS.success;
      ctx.fill();
      ctx.fillStyle = COLORS.white;
      ctx.font = '700 18px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(data.correct, 88, cY + cH / 2 + 1);

      ctx.fillStyle = COLORS.white;
      ctx.font = '600 ' + cFit.size + 'px Inter, system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      let cy = cY + cH / 2 - (cFit.lines.length * cFit.lh) / 2 + cFit.lh * 0.7;
      for (const line of cFit.lines) { ctx.fillText(line, 125, cy); cy += cFit.lh; }

      const ratY = cY + cH + 16;
      const maxRatH = HEIGHT - ratY - 40;
      const ratFit = fitFont(ctx, data.rationale, WIDTH - 100, maxRatH - 70, 22, '500', 1.28);
      const ratH = Math.min(maxRatH, Math.max(200, ratFit.lines.length * ratFit.lh + 80));

      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      roundRect(ctx, 28, ratY, WIDTH - 56, ratH, 14);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 1.5;
      roundRect(ctx, 28, ratY, WIDTH - 56, ratH, 14);
      ctx.stroke();

      ctx.fillStyle = COLORS.gold;
      ctx.font = '700 18px Inter, system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText('RATIONALE', 48, ratY + 18);

      ctx.fillStyle = COLORS.white;
      ctx.font = '500 ' + ratFit.size + 'px Inter, system-ui, sans-serif';
      let ry = ratY + 48;
      for (const line of ratFit.lines) {
        if (ry > ratY + ratH - 20) break;
        ctx.fillText(line, 48, ry);
        ry += ratFit.lh;
      }

      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '500 14px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('NPTE Institute  ·  Elevate Your Practice', WIDTH / 2, HEIGHT - 22);
    }

    // ===== CARD 3: CTA =====
    function drawCTA(ctx, data) {
      fillBg(ctx);

      const glow = ctx.createRadialGradient(WIDTH / 2, 320, 10, WIDTH / 2, 320, 200);
      glow.addColorStop(0, 'rgba(13,148,136,0.3)');
      glow.addColorStop(1, 'rgba(13,148,136,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      drawLogo(ctx, WIDTH / 2, 280, 88);

      ctx.fillStyle = COLORS.white;
      ctx.font = '700 34px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('NPTE Institute', WIDTH / 2, 420);

      ctx.fillStyle = COLORS.gold;
      ctx.font = '600 18px Inter, system-ui, sans-serif';
      ctx.fillText('Elevate Your Practice', WIDTH / 2, 455);

      const boxW = WIDTH - 80;
      const box1Y = 520;
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      roundRect(ctx, 40, box1Y, boxW, 90, 14);
      ctx.fill();
      ctx.strokeStyle = 'rgba(20,184,166,0.45)';
      ctx.lineWidth = 2;
      roundRect(ctx, 40, box1Y, boxW, 90, 14);
      ctx.stroke();

      ctx.fillStyle = COLORS.tealLight;
      ctx.font = '700 16px Inter, system-ui, sans-serif';
      ctx.fillText('FOLLOW', WIDTH / 2, box1Y + 28);
      ctx.fillStyle = COLORS.white;
      const ctaFit = fitFont(ctx, data.ctaLine, boxW - 40, 40, 20, '600', 1.2);
      ctx.font = '600 ' + ctaFit.size + 'px Inter, system-ui, sans-serif';
      let ty = box1Y + 56;
      for (const line of ctaFit.lines.slice(0, 2)) { ctx.fillText(line, WIDTH / 2, ty); ty += ctaFit.lh; }

      const box2Y = box1Y + 110;
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      roundRect(ctx, 40, box2Y, boxW, 90, 14);
      ctx.fill();
      ctx.strokeStyle = 'rgba(212,160,23,0.45)';
      ctx.lineWidth = 2;
      roundRect(ctx, 40, box2Y, boxW, 90, 14);
      ctx.stroke();

      ctx.fillStyle = COLORS.gold;
      ctx.font = '700 16px Inter, system-ui, sans-serif';
      ctx.fillText('SHARE', WIDTH / 2, box2Y + 28);
      ctx.fillStyle = COLORS.white;
      const shFit = fitFont(ctx, data.shareLine, boxW - 40, 40, 20, '600', 1.2);
      ctx.font = '600 ' + shFit.size + 'px Inter, system-ui, sans-serif';
      ty = box2Y + 56;
      for (const line of shFit.lines.slice(0, 2)) { ctx.fillText(line, WIDTH / 2, ty); ty += shFit.lh; }

      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '500 14px Inter, system-ui, sans-serif';
      ctx.fillText('New questions weekly', WIDTH / 2, HEIGHT - 30);
    }

    function renderAll() {
      const data = collect();
      drawQuestion(ctx1, data);
      drawRationale(ctx2, data);
      drawCTA(ctx3, data);
    }

    function downloadCanvas(canvas, name) {
      const a = document.createElement('a');
      a.download = name;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

    document.getElementById('btnRender').addEventListener('click', () => {
      renderAll();
      document.getElementById('status').textContent = 'Previews updated';
    });

    document.getElementById('btnDownloadAll').addEventListener('click', () => {
      renderAll();
      downloadCanvas(c1, 'NPTE-IG-1-Question.png');
      setTimeout(() => downloadCanvas(c2, 'NPTE-IG-2-Rationale.png'), 250);
      setTimeout(() => downloadCanvas(c3, 'NPTE-IG-3-Follow.png'), 500);
      document.getElementById('status').textContent = 'Downloaded 3 PNGs (1080×1080)';
    });

    document.querySelectorAll('button[data-card]').forEach(btn => {
      btn.addEventListener('click', () => {
        renderAll();
        const n = btn.getAttribute('data-card');
        const map = { '1': c1, '2': c2, '3': c3 };
        const names = { '1': 'NPTE-IG-1-Question.png', '2': 'NPTE-IG-2-Rationale.png', '3': 'NPTE-IG-3-Follow.png' };
        downloadCanvas(map[n], names[n]);
        document.getElementById('status').textContent = 'Downloaded ' + names[n];
      });
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      document.getElementById('question').value = 'On assessment, a patient tests positive for the Dix-Hallpike test on the right side for posterior canalithiasis. Which finding is MOST LIKELY?';
      document.getElementById('optA').value = 'Downbeating torsional nystagmus for 120 seconds';
      document.getElementById('optB').value = 'Upbeating torsional nystagmus for 70 seconds';
      document.getElementById('optC').value = 'Downbeating torsional nystagmus for 10 seconds';
      document.getElementById('optD').value = 'Upbeating torsional nystagmus for 40 seconds';
      document.querySelector('input[name="correct"][value="D"]').checked = true;
      document.getElementById('rationale').value = 'Right Dix-Hallpike with upbeating torsional nystagmus lasting under 60 seconds indicates right posterior canal canalithiasis — the most common BPPV variant.';
      document.getElementById('ctaLine').value = 'Follow for more NPTE questions & tips';
      document.getElementById('shareLine').value = 'Share with a classmate and test their knowledge';
      renderAll();
      document.getElementById('status').textContent = 'Sample content restored';
    });

    let t = null;
    function schedule() {
      clearTimeout(t);
      t = setTimeout(renderAll, 180);
    }
    ['question', 'optA', 'optB', 'optC', 'optD', 'rationale', 'ctaLine', 'shareLine'].forEach(id => {
      document.getElementById(id).addEventListener('input', schedule);
    });
    document.querySelectorAll('input[name="correct"]').forEach(el => el.addEventListener('change', schedule));

    window.addEventListener('load', () => { renderAll(); setTimeout(renderAll, 300); });
    renderAll();
  </script>
</body>
</html>
